# Local Airflow 3.3.2 + a Postgres warehouse. Adapted from the official docker-compose.yaml
# (https://airflow.apache.org/docs/apache-airflow/3.3.2/docker-compose.yaml): LocalExecutor instead of
# Celery (no Redis or worker), a custom image instead of _PIP_ADDITIONAL_REQUIREMENTS, examples off, and a
# second Postgres that plays the warehouse. Local development only; credentials come from .env.
x-airflow-common:
  &airflow-common
  build: .
  image: airflow-elt:3.3.2
  env_file: [.env]
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__API_AUTH__JWT_SECRET: ${JWT_SECRET}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW_CONN_WAREHOUSE: postgresql://warehouse:${WAREHOUSE_PASSWORD}@warehouse:5432/warehouse
    AIRFLOW_CONN_SUPERSET_DB: postgresql://superset:${SUPERSET_DB_PASSWORD}@superset-db:5432/superset  # BI add-on
    AIRFLOW_CONFIG: /opt/airflow/config/airflow.cfg
  volumes:
    - ./dags:/opt/airflow/dags
    - ./include:/opt/airflow/include
    - ./dbt:/opt/airflow/dbt
    - ./tests:/opt/airflow/tests
    - ./scripts:/opt/airflow/scripts
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs
    - ./config:/opt/airflow/config
    - ./plugins:/opt/airflow/plugins
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy
    warehouse:
      condition: service_healthy

services:
  postgres:                     # Airflow's metadata database
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes: [airflow-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  warehouse:                    # the data warehouse the pipeline writes to
    image: postgres:16
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD}
      POSTGRES_DB: warehouse
    command: ["postgres", "-c", "shared_buffers=1GB", "-c", "work_mem=64MB", "-c", "maintenance_work_mem=512MB",
              "-c", "max_wal_size=4GB"]
    ports: ["127.0.0.1:5433:5432"]  # psql/BI tools from the host; localhost only
    volumes: [warehouse-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "warehouse"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:                 # one-shot: migrate the metadata DB, create the load pool
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/{logs,dags,plugins,config,data}
        /entrypoint airflow config list >/dev/null
        /entrypoint airflow pools set warehouse_load 2 "Concurrent bulk loads into the warehouse"
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/{logs,dags,plugins,config,data}
        /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    user: "0:0"

  dbt-docs:                     # make docs -> http://localhost:8081 (profile "docs", off by default)
    <<: *airflow-common
    profiles: [docs]
    entrypoint: /bin/bash
    command:
      - -c
      - |
        cd /opt/airflow/dbt/taxi
        /home/airflow/dbt-venv/bin/dbt docs generate --profiles-dir . --target-path /tmp/dbt-docs
        cd /tmp/dbt-docs && exec python -m http.server 8081
    ports: ["127.0.0.1:8081:8081"]
    restart: "no"

  # ---- BI add-on (profile "bi", off by default): make bi-up -------------------------------------------
  cubestore:                    # Cube's cache/rollup store for pre-aggregations
    image: cubejs/cubestore:v1.8.19
    profiles: [bi]
    environment:
      CUBESTORE_REMOTE_DIR: /cube/data
    volumes: [cubestore-data:/cube/data]
    restart: always

  cube:                         # semantic layer: REST :4000, Postgres-wire SQL API :15432
    image: cubejs/cube:v1.8.19
    profiles: [bi]
    depends_on: [cubestore]
    environment:
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: warehouse
      CUBEJS_DB_NAME: warehouse
      CUBEJS_DB_USER: cube_reader
      CUBEJS_DB_PASS: ${CUBE_DB_PASSWORD}
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET}
      CUBEJS_DEV_MODE: "false"
      CUBEJS_CUBESTORE_HOST: cubestore
      CUBEJS_REFRESH_WORKER: "true"
      CUBEJS_PG_SQL_PORT: "15432"
      CUBEJS_SQL_SUPER_USER: ""
      CUBE_SQL_ADMIN_USER: ${CUBE_SQL_ADMIN_USER}
      CUBE_SQL_ADMIN_PASSWORD: ${CUBE_SQL_ADMIN_PASSWORD}
      CUBE_SQL_ANALYST_USER: ${CUBE_SQL_ANALYST_USER}
      CUBE_SQL_ANALYST_PASSWORD: ${CUBE_SQL_ANALYST_PASSWORD}
      CUBE_SQL_ANALYST_BOROUGH: ${CUBE_SQL_ANALYST_BOROUGH}
    volumes: [./bi/cube:/cube/conf]
    ports: ["127.0.0.1:4000:4000", "127.0.0.1:15432:15432"]
    restart: always

  superset-db:
    image: postgres:16
    profiles: [bi]
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: ${SUPERSET_DB_PASSWORD}
      POSTGRES_DB: superset
    ports: ["127.0.0.1:5434:5432"]  # host access for make bi-check; localhost only
    volumes: [superset-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "superset"]
      interval: 10s
      retries: 5
    restart: always

  superset:                     # dashboards on the certified semantic layer: http://localhost:8088
    build: ./bi/superset
    image: airflow-elt-superset:6.1.0
    profiles: [bi]
    depends_on:
      superset-db:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
    ports: ["127.0.0.1:8088:8088"]
    restart: always

  airflow-cli:                  # docker compose run --rm airflow-cli <airflow args>
    <<: *airflow-common
    profiles: [debug]
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    command: [bash, -c, airflow]

volumes:
  airflow-db:
  warehouse-db:
  cubestore-data:
  superset-db:
