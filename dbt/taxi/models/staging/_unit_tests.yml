version: 2

# dbt unit tests: fixed input rows -> expected output rows, run with `make dbt-unit` (target `unit`,
# schemas unit_*). They pin the logic that row-count tests can only check indirectly.
unit_tests:
  - name: exclusion_reason_labels_each_kind_of_bad_row
    description: Every dropped row gets exactly one reason, checked in priority order; a clean trip gets none.
    model: stg_yellow_trips
    given:
      - input: source('raw', 'yellow_trips')
        format: csv
        rows: |
          source_month,tpep_pickup_datetime,tpep_dropoff_datetime,trip_distance,fare_amount,total_amount,payment_type,pulocationid
          2024-01-01,2024-01-10 08:00:00,2024-01-10 08:20:00,3.1,15.0,20.0,1,1
          2024-01-01,2023-12-31 23:50:00,2024-01-01 00:10:00,3.1,15.0,20.0,1,2
          2024-01-01,2024-01-10 08:00:00,2024-01-10 07:59:00,3.1,15.0,20.0,1,3
          2024-01-01,2024-01-10 08:00:00,2024-01-10 15:00:00,3.1,15.0,20.0,1,4
          2024-01-01,2024-01-10 08:00:00,2024-01-10 08:20:00,3.1,-15.0,-20.0,1,5
          2024-01-01,2024-01-10 08:00:00,2024-01-10 08:20:00,3.1,15.0,20.0,4,6
          2024-01-01,2024-01-10 08:00:00,2024-01-10 08:20:00,0.0,15.0,20.0,1,7
          2024-01-01,2024-01-10 08:00:00,2024-01-10 08:20:00,250.0,15.0,20.0,1,8
          2024-01-01,2024-01-31 23:59:00,2024-01-10 08:20:00,-1.0,-15.0,-20.0,4,9
    expect:
      format: csv
      rows: |
        pickup_zone_id,trip_minutes,exclusion_reason
        1,20,
        2,20,pickup_outside_month
        3,-1,dropoff_before_pickup
        4,420,over_6_hours
        5,20,negative_amount
        6,20,no_charge_dispute_void
        7,20,implausible_distance
        8,20,implausible_distance
        9,-31179,dropoff_before_pickup

  - name: approved_months_needs_a_passing_check_newer_than_the_load
    description: >-
      Jan: latest check passed (an older failure is superseded). Feb: latest check failed an error rule.
      Mar: passed only a warn-level rule failure. Apr: reloaded after its last check, so not yet approved.
    model: approved_months
    given:
      - input: source('audit', 'dq_results')
        format: csv
        rows: |
          source_month,run_id,rule,severity,passed,checked_at
          2024-01-01,r1,row_count,error,false,2024-03-01 00:00:00
          2024-01-01,r2,row_count,error,true,2024-03-02 00:00:00
          2024-01-01,r2,negative_fare_share,warn,true,2024-03-02 00:00:00
          2024-02-01,r3,row_count,error,true,2024-04-01 00:00:00
          2024-02-01,r3,pickup_in_month,error,false,2024-04-01 00:00:00
          2024-03-01,r4,row_count,error,true,2024-05-01 00:00:00
          2024-03-01,r4,passenger_null_share,warn,false,2024-05-01 00:00:00
          2024-04-01,r5,row_count,error,true,2024-06-01 00:00:00
      - input: source('raw', 'yellow_trips')
        format: csv
        rows: |
          source_month,loaded_at
          2024-01-01,2024-03-01 23:00:00
          2024-02-01,2024-03-31 00:00:00
          2024-03-01,2024-04-30 00:00:00
          2024-04-01,2024-06-02 00:00:00
    expect:
      format: csv
      rows: |
        source_month
        2024-01-01
        2024-03-01
